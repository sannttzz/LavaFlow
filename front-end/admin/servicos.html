<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços e preços | LavaFlow</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="app" data-area="admin">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="conteudo">
    <header class="cabecalho-pagina">
      <div>
        <h1>Serviços e preços</h1>
        <p class="texto-suave">Gerencie o catálogo, valores e tempos estimados.</p>
      </div>
      <button class="botao" id="btn-novo-servico">+ Novo serviço</button>
    </header>

    <!-- as linhas são desenhadas pelo JavaScript -->
    <div id="lista-servicos-admin"></div>

    <p class="aviso">Alterações na duração afetam as próximas sugestões de entrada. Agendamentos confirmados mantêm os horários originais.</p>
  </main>

  <dialog class="modal" id="modal-servico">
    <h2 id="titulo-modal-servico">Novo serviço</h2>
    <form id="form-servico">
      <div class="campo"><label for="s-nome">Nome</label><input type="text" id="s-nome" required></div>
      <div class="campo"><label for="s-descricao">Descrição</label><input type="text" id="s-descricao"></div>
      <div class="campo"><label for="s-preco">Preço (R$)</label><input type="number" id="s-preco" min="0" step="0.01" required></div>
      <div class="campo"><label for="s-duracao">Duração (minutos)</label><input type="number" id="s-duracao" min="5" step="5" required></div>
      <div class="modal-acoes">
        <button type="button" class="botao botao-claro" id="btn-fechar-servico">Cancelar</button>
        <button type="submit" class="botao">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="../js/sidebar.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/servicos-admin.js"></script>
</body>
</html>
