<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus veículos | LavaFlow</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="app" data-area="cliente" data-pagina="veiculos">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="conteudo">
  <header class="cabecalho-pagina">
    <div>
      <h1>Meus veículos</h1>
      <p class="texto-suave">Gerencie os veículos disponíveis para agendamento.</p>
    </div>
    <button class="botao" id="btn-novo-veiculo">+ Adicionar veículo</button>
  </header>

  <!-- os cartões são desenhados pelo JavaScript -->
  <div class="grade-3" id="lista-veiculos"></div>
</main>

<dialog class="modal" id="modal-veiculo">
  <h2>Adicionar veículo</h2>
  <form id="form-veiculo">
    <div class="campo"><label for="marca">Marca</label><input type="text" id="marca" placeholder="Ex.: Fiat" required></div>
    <div class="campo"><label for="modelo">Modelo</label><input type="text" id="modelo" placeholder="Ex.: Argo" required></div>
    <div class="campo"><label for="placa">Placa</label><input type="text" id="placa" placeholder="ABC-1D23" maxlength="8" required></div>
    <div class="campo"><label for="cor">Cor</label><input type="text" id="cor" placeholder="Ex.: Preto" required></div>
    <div class="modal-acoes">
      <button type="button" class="botao botao-claro" id="btn-fechar-veiculo">Cancelar</button>
      <button type="submit" class="botao">Salvar</button>
    </div>
  </form>
</dialog>

<script src="../js/sidebar.js"></script>
<script src="../js/veiculos.js"></script>

  <script src="../js/sidebar.js"></script>
</body>
</html>
